name: Build FDCS Android APK

# Buildozer only runs on Linux, so if you're on Windows this workflow
# builds the APK for you in GitHub's cloud instead.
# Trigger it manually from the "Actions" tab, or on every push to main.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Move checkout to a short path
        # GitHub Actions checks this repo out under a path containing its
        # (long) name TWICE: /home/runner/work/<repo>/<repo>/. Buildozer's
        # hostpython3 build later generates a `pip3` script whose shebang
        # line embeds the FULL absolute path to the build's own Python
        # interpreter - many directories deeper still. That total path
        # exceeds the Linux kernel's ~128-256 byte shebang-line limit, so
        # the shebang gets silently truncated/corrupted and the kernel
        # can't execute it ("OSError: [Errno 8] Exec format error" -
        # nothing to do with any package version, purely path length).
        # Moving everything to a short /tmp path before building avoids it.
        run: |
          mkdir -p /tmp/fdcs
          cp -r . /tmp/fdcs/
          echo "Building from /tmp/fdcs (path length: ${#PWD} -> $(cd /tmp/fdcs && echo ${#PWD}))"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ubuntu-22.04 runners ship several JDKs side by side (11, 17, 21, ...)
      # with JDK 11 as the ambient default. Installing `openjdk-17-jdk` via
      # apt does NOT change that default - `javac`/JAVA_HOME still resolved
      # to JDK 11 everywhere, including for the final Gradle step, which
      # failed instantly with "Android Gradle plugin requires Java 17 to
      # run. You are currently using Java 11." setup-java explicitly
      # exports JAVA_HOME and prepends JDK 17's bin/ to PATH for every
      # later step in this job (including buildozer's own subprocesses),
      # which apt installation alone doesn't do.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Prefetch freetype from a working mirror
        working-directory: /tmp/fdcs
        # python-for-android's freetype recipe hardcodes
        # download.savannah.gnu.org, and Savannah has now killed two builds
        # of an unmodified tree with 502/504. It stays down for tens of
        # minutes at a stretch, so p4a's four retries over ~15 seconds - and
        # a workflow-level retry too - are simply the wrong tool: you cannot
        # retry your way onto a host that is off.
        #
        # freetype ships the identical tarball on SourceForge (the recipe's
        # own docstring points there) and across the nongnu mirror network,
        # so the fix is to put the file where p4a looks before it looks.
        #
        # p4a's Recipe.download() accepts a pre-existing download only when
        # BOTH the tarball and its `.mark-<tarball>` marker are present:
        #
        #     if exists(filename) and isfile(filename):
        #         if not exists(marker_filename):
        #             shprint(sh.rm, filename)      # treated as a partial
        #         else:
        #             ...verify digests...
        #             do_download = False
        #
        # A tarball with no marker is read as an interrupted download and
        # deleted, which is exactly what happened to the first version of
        # this step. Seeding both needs no recipe override and no patched
        # URL - the only p4a internals it depends on are that path and this
        # rule, and tests/test_workflow.sh pins the rule.
        #
        # SECURITY: the freetype recipe declares no checksum, so p4a will not
        # verify whatever a mirror hands it. The digest below is pinned here
        # and checked before the file is trusted; it was verified
        # byte-identical from two independent mirrors.
        #
        # Keyed to the version p4a currently pins (2.14.1). If p4a moves to a
        # newer freetype the filename no longer matches, this step seeds a
        # file nothing reads, and the build falls back to Savannah plus the
        # retry loop below. Degraded, but not broken - and the log says so.
        run: |
          version=2.14.1
          sha256=174d9e53402e1bf9ec7277e22ec199ba3e55a6be2c0740cb18c0ee9850fc8c34
          tarball=freetype-$version.tar.gz
          tmp=$(mktemp -d)

          got=""
          for url in \
            "https://downloads.sourceforge.net/project/freetype/freetype2/$version/$tarball" \
            "https://mirror.csclub.uwaterloo.ca/nongnu/freetype/$tarball" \
            "https://download-mirror.savannah.gnu.org/releases/freetype/$tarball"; do
            echo "Trying $url"
            if curl -fsSL --retry 3 --retry-all-errors --max-time 180 -o "$tmp/$tarball" "$url" \
               && echo "$sha256  $tmp/$tarball" | sha256sum -c - > /dev/null; then
              echo "Fetched and verified $tarball"
              got=yes
              break
            fi
            echo "  unusable (download failed or digest mismatch) - next mirror"
            rm -f "$tmp/$tarball"
          done

          if [ -z "$got" ]; then
            echo "::warning::Could not prefetch $tarball from any mirror; buildozer will try Savannah itself."
            exit 0
          fi

          # Read the arch list from the spec rather than hardcoding it, so
          # this keeps seeding the right directories if the spec gains one.
          archs=$(sed -n 's/^[[:space:]]*android\.archs[[:space:]]*=[[:space:]]*//p' buildozer.spec | tr -d '[:space:]' | tr ',' ' ')
          archs=${archs:-arm64-v8a}
          for arch in $archs; do
            dest=".buildozer/android/platform/build-$arch/packages/freetype"
            mkdir -p "$dest"
            cp "$tmp/$tarball" "$dest/$tarball"
            # The marker is not optional. p4a's Recipe.download() treats a
            # tarball with no .mark- file beside it as a partial download and
            # deletes it - the first version of this step seeded the file
            # without one and watched p4a `rm` it and go back to Savannah.
            touch "$dest/.mark-$tarball"
            echo "Seeded $dest/$tarball (+ marker)"
          done

      - name: Build APK with Buildozer
        working-directory: /tmp/fdcs
        # python-for-android allows a failed source download only four tries
        # across ~15 seconds and then aborts the whole build. Some of the
        # mirrors it pulls from are unreliable - download.savannah.gnu.org,
        # which hosts freetype, has returned 502/504 for long enough to kill
        # a build of an unmodified tree. That is a red build that says
        # nothing about the code.
        #
        # Retrying costs almost nothing because buildozer is incremental:
        # python-for-android marks each tarball it has fetched and each
        # recipe it has built under .buildozer, so attempt two re-downloads
        # only the file the outage interrupted and resumes from there.
        #
        # Only NETWORK failures are retried. Retrying everything would
        # rebuild a genuine compile error three times over, turning a
        # 4-minute red build into a 40-minute one and burying the real
        # message under two repeats - so the log has to actually name a
        # transport fault before we go round again.
        run: |
          attempt=1
          max=3
          while true; do
            echo "::group::Buildozer attempt $attempt of $max"
            # `yes` answers buildozer's prompts and is then killed by SIGPIPE
            # when buildozer stops reading, so its exit status is noise -
            # PIPESTATUS[1] is buildozer's own. This is also why `set -o
            # pipefail` must NOT be used here: it would read that broken pipe
            # as a failed build on every successful run.
            yes | buildozer -v android debug 2>&1 | tee "attempt-$attempt.log"
            status=${PIPESTATUS[1]}
            echo "::endgroup::"

            if [ "$status" -eq 0 ]; then
              echo "Build succeeded on attempt $attempt."
              exit 0
            fi

            if [ "$attempt" -ge "$max" ]; then
              echo "::error::Build failed after $attempt attempts."
              exit "$status"
            fi

            if grep -qiE 'Download failed|HTTPError|URLError|Bad Gateway|Gateway Time-out|Connection reset|Connection refused|Temporary failure in name resolution|TimeoutError|IncompleteRead|Network is unreachable' "attempt-$attempt.log"; then
              backoff=$((attempt * 60))
              echo "Attempt $attempt died fetching a dependency, not building one."
              echo "Retrying in ${backoff}s - buildozer resumes from what it already has."
              rm -f "attempt-$attempt.log"
              sleep "$backoff"
              attempt=$((attempt + 1))
            else
              echo "::error::Attempt $attempt failed for a reason that is not a network fault. Not retrying - the real error is in the log above."
              exit "$status"
            fi
          done

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdcs-debug-apk
          path: /tmp/fdcs/bin/*.apk
