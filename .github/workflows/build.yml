name: Build FDCS Android APK

# Buildozer only runs on Linux, so if you're on Windows this workflow
# builds the APK for you in GitHub's cloud instead.
# Trigger it manually from the "Actions" tab, or on every push to main.

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Move checkout to a short path
        # GitHub Actions checks this repo out under a path containing its
        # (long) name TWICE: /home/runner/work/<repo>/<repo>/. Buildozer's
        # hostpython3 build later generates a `pip3` script whose shebang
        # line embeds the FULL absolute path to the build's own Python
        # interpreter - many directories deeper still. That total path
        # exceeds the Linux kernel's ~128-256 byte shebang-line limit, so
        # the shebang gets silently truncated/corrupted and the kernel
        # can't execute it ("OSError: [Errno 8] Exec format error" -
        # nothing to do with any package version, purely path length).
        # Moving everything to a short /tmp path before building avoids it.
        run: |
          mkdir -p /tmp/fdcs
          cp -r . /tmp/fdcs/
          echo "Building from /tmp/fdcs (path length: ${#PWD} -> $(cd /tmp/fdcs && echo ${#PWD}))"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ubuntu-22.04 runners ship several JDKs side by side (11, 17, 21, ...)
      # with JDK 11 as the ambient default. Installing `openjdk-17-jdk` via
      # apt does NOT change that default - `javac`/JAVA_HOME still resolved
      # to JDK 11 everywhere, including for the final Gradle step, which
      # failed instantly with "Android Gradle plugin requires Java 17 to
      # run. You are currently using Java 11." setup-java explicitly
      # exports JAVA_HOME and prepends JDK 17's bin/ to PATH for every
      # later step in this job (including buildozer's own subprocesses),
      # which apt installation alone doesn't do.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip python3-pip \
            autoconf libtool pkg-config zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

      - name: Install buildozer & cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.36

      - name: Build APK with Buildozer
        working-directory: /tmp/fdcs
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fdcs-debug-apk
          path: /tmp/fdcs/bin/*.apk
